    trust_level: 82
    requires_browser: true
    enabled: true
    notes: 国聘校招入口，重点关注 2027 届、青岛、山东、网络安全、信息技术关键词。

  - name: 国资央企招聘平台
    url: https://cujiuye.iguopin.com/
