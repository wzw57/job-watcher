sources:
  - name: 国聘
    url: https://www.iguopin.com/
    source_type: public_platform
    provider: iguopin
    trust_level: 80
    requires_browser: true
    enabled: true
    notes: 国企、央企、重点企业招聘聚合平台；第一版作为线索源和搜索补漏源。

  - name: 国聘校园招聘
